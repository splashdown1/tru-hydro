<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1a14">
<title>TRU HYDRO</title>
<style>
:root{--bg:#0f1a14;--ink:#e6f0e8;--dim:#9bb0a0;--line:#2a3c32;--green:#8bc49a;--card:#16221c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--green)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0a120e;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--green);color:#0f1a14;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--green);font-size:12px;letter-spacing:.12em} .big{font-size:20px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>TRU <span>HYDRO</span></h1>
  <p class="sub">Offline field card for hydroponic plant growing. Setup · light · water · nutrients · steps to fruit or flower. Source-bound practical ranges. A gap stays a gap.</p>
</header>
<div class="bar">
  <input id="q" placeholder="pH, EC, Kratky, DWC, light, nutrients, fruit…" enterkeyhint="search">
  <button id="send">Send</button>
</div>
<main id="out"></main>
<script>
const H=[
{t:"Core numbers",d:"pH 5.5–6.5 (target often 5.8–6.2). Outside this range nutrients lock out. EC (mS/cm): seedlings 0.4–0.8; leafy greens 1.0–1.8; fruiting (tomato/pepper) 1.8–2.5+ (up to ~3.5 peak). Start low and raise gradually. Solution temperature 18–22 °C preferred; keep under ~24 °C. Continuous aeration in active systems; air gap in passive. Photoperiod leafy 14–16 h; fruiting often 16–18 h veg then adjust. PPFD (µmol/m²/s): seedlings 100–200; leafy ~150–350; fruiting 400–700+. DLI leafy ~12–17; fruiting ~20–30 mol/m²/day."},
{t:"Kratky (passive)",d:"Best first system for lettuce and herbs. No pump, no electricity. Opaque container + lid with net-pot hole(s) + inert media (clay pebbles / LECA or rockwool) + nutrient solution. Fill so solution just touches the bottom of the net pot. As the plant drinks, an air gap forms for oxygen. Do not refill to the top once roots are established. Limited to smaller/faster crops; reservoir empties by harvest."},
{t:"DWC (Deep Water Culture)",d:"Roots hang in aerated solution. Air pump + air stone running continuously. Good for greens and can scale to larger plants. Opaque bucket or tote with lid + net pots. One plant per 5-gallon bucket is common for fruiting types. Opaque everything that holds solution — light on the water grows algae."},
{t:"Other systems",d:"NFT (thin film in channels, continuous pump — good for greens). Drip / Dutch bucket (media + drip, better for larger fruiting plants). Start simple; add complexity only after you can hold pH and EC steady."},
{t:"Setup steps",d:"1. Clean opaque container and lid. Drill or cut holes for net pots (2–3 inch typical). 2. Rinse media. 3. Start seeds in rockwool/plugs or buy clean seedlings; transplant when roots show. 4. Mix nutrient solution to target EC (half strength or less for seedlings). Add nutrients to water first, then adjust pH last. 5. Place net pot so media/roots just contact solution (Kratky) or are submerged with aeration (DWC). 6. Provide light and airflow. Monitor daily at first. 7. Top up as needed; full change when EC drifts high or roots look stressed."},
{t:"Light",d:"Full-spectrum LED preferred. Distance typically 12–24 inches (follow fixture guidance). Leafy: 14–16 h common. Fruiting: higher intensity and often longer photoperiod in vegetative phase; many shift spectrum or hours for flower/fruit set. Indoor fruiting usually needs hand pollination and support. Measure PPFD at canopy if you can. Over-lighting leafy greens can cause tip burn; under-lighting fruiting crops yields poor set."},
{t:"Water, nutrients, stages",d:"Order: mix nutrients → measure EC → adjust pH. Leafy greens stay on a more vegetative (higher N) profile. Fruiting crops: raise overall EC and shift toward higher P/K once flowering starts. Calcium is important (blossom-end rot risk if low or uneven). Stages: germination/seedling (low EC, modest light); vegetative (increase light and EC); flower/fruit (higher light demand, adjusted ratio, support, pollination). Harvest leafy in 3–8 weeks typical; fruiting often 75–110+ days depending on variety."},
{t:"Getting to fruit or flower",d:"Choose compact or dwarf varieties for small systems. Strong continuous light (higher PPFD/DLI). Stable root-zone oxygen, temperature, pH, EC. Transition nutrient profile at first flower. Air movement, support structures, and (indoors) manual pollination. Prune suckers on indeterminate tomatoes if desired. Watch for stress: yellowing, tip burn, stalled growth, root browning or slime."},
{t:"Common failure modes",d:"pH drift outside 5.5–6.5 → lockout. High reservoir temperature → low oxygen → root rot. Light leaks into solution → algae. Overfeeding (high EC) → tip burn / salt stress. Underfeeding → pale slow growth. Pump or air failure in active systems → rapid root death. Inconsistent light or temperature → bolting (greens) or poor fruit set. Hard or unknown source water without testing can fight pH/EC targets."},
{t:"Materials minimum",d:"Opaque container + lid, net pots, media (clay pebbles / LECA or rockwool), hydroponic nutrient (not soil fertilizer), pH meter or kit + up/down solutions, EC/TDS meter (know your scale: often EC × 500 ≈ ppm), thermometer, timer + lights if indoor, air pump and stone for DWC."},
{t:"Gap",d:"No complete commercial system design, no variety-specific recipes, no brand nutrient schedules, no live sensor integration. Practical starter ranges and steps only. Measure your own solution and plants. Specific labels and local water chemistry override general numbers. If a number or step is missing for your exact crop or conditions, that is a gap."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function card(x){return `<article class=\"card\"><div class=\"k\">HYDRO</div><div class=\"big\">${esc(x.t)}</div><div>${esc(x.d)}</div><div class=\"src\">Source-bound practical ranges from extension and grower references. Measure; do not guess. A gap stays a gap.</div></article>`;}
function show(list){document.getElementById(\"out\").innerHTML=list.map(card).join(\"\");}
function search(q){
  q=(q||\"\").trim().toLowerCase();
  if(!q){show(H);return;}
  const hits=H.filter(x=>(x.t+\" \"+x.d).toLowerCase().includes(q));
  document.getElementById(\"out\").innerHTML=hits.length?hits.map(card).join(\"\"):`<article class=\"card\"><div class=\"k\">GAP</div><div class=\"big\">Not packed</div><div>No complete commercial design or variety recipe on this card. Practical starter ranges only.</div></article>`;
}
document.getElementById(\"send\").onclick=()=>search(document.getElementById(\"q\").value);
document.getElementById(\"q\").onkeydown=e=>{if(e.key===\"Enter\")search(e.target.value);};
show(H);
</script>
</body>
</html>
